# yolo11-mid-p3 baseline + OffsetGuidedDeformableAlignment at P2/4 only.
# IR is aligned to RGB after both P2 C3k2 blocks, then the aligned IR is fed
# into the original IR P3 extractor. Fusion remains the baseline P3 Concat.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]
channels: 4
ch: 4

backbone:
  - [-1, 1, Silence, []]  # 0

  # Visible branch
  - [0, 1, SilenceChannel, [0, 3]]  # 1
  - [-1, 1, Conv, [64, 3, 2]]  # 2 P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 3 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 4 RGB P2
  - [-1, 1, Conv, [256, 3, 2]]  # 5 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 6 RGB P3

  # Infrared branch
  - [0, 1, SilenceChannel, [3, 4]]  # 7
  - [-1, 1, Conv, [64, 3, 2]]  # 8 P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 9 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 10 IR P2

  # Align IR P2 to the RGB P2 coordinate system before extracting IR P3.
  - [[10, 4], 1, OffsetGuidedDeformableAlignment, [3, 16, 4.0, 2.0, True, False]]  # 11 aligned IR P2
  - [-1, 1, Conv, [256, 3, 2]]  # 12 P3/8, consumes aligned IR P2
  - [-1, 2, C3k2, [512, False, 0.25]]  # 13 IR P3

  # Original baseline P3 fusion.
  - [[6, 13], 1, Concat, [1]]  # 14 RGB P3 + IR P3
  - [-1, 1, Conv, [512, 1, 1]]  # 15 fused P3/8

  - [-1, 1, Conv, [512, 3, 2]]  # 16 P4/16
  - [-1, 2, C3k2, [512, True]]  # 17
  - [-1, 1, Conv, [1024, 3, 2]]  # 18 P5/32
  - [-1, 2, C3k2, [1024, True]]  # 19
  - [-1, 1, SPPF, [1024, 5]]  # 20
  - [-1, 2, C2PSA, [1024]]  # 21

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 22
  - [[-1, 17], 1, Concat, [1]]  # 23
  - [-1, 2, C3k2, [512, False]]  # 24

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 25
  - [[-1, 15], 1, Concat, [1]]  # 26
  - [-1, 2, C3k2, [256, False]]  # 27 P3/8

  - [-1, 1, Conv, [256, 3, 2]]  # 28
  - [[-1, 24], 1, Concat, [1]]  # 29
  - [-1, 2, C3k2, [512, False]]  # 30 P4/16

  - [-1, 1, Conv, [512, 3, 2]]  # 31
  - [[-1, 21], 1, Concat, [1]]  # 32
  - [-1, 2, C3k2, [1024, True]]  # 33 P5/32

  - [[27, 30, 33], 1, OBB, [nc, 1]]  # 34
